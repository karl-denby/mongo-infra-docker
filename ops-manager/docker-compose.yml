version: "3.9"
services:
  ops:
    build:
      context: .
      dockerfile: ./build/Dockerfile-aarch64-rhel8-om
    container_name: ops
    deploy:
      resources:
        limits:
          cpus: '2.000'
          memory: 8G
        reservations:
          cpus: '1.000'
          memory: 4G
    hostname: ops.om.internal
    networks:
      main:
        aliases:
          - ops
          - ops.om.internal
          - ops.alt.internal
    privileged: true
    ports:
      - "8080:8080"
      - "8443:8443"
      - "25999:25999"
      - "27700-27719:27700-27719"
    volumes:
      - ./certs:/certs

  node1:
    build:
      context: .
      dockerfile: ./build/Dockerfile-aarch64-rhel8-node
    container_name: node1
    deploy:
      resources:
        limits:
          cpus: '2.000'
          memory: 2.5G
        reservations:
          cpus: '0.500'
          memory: 1G
    hostname: node1.om.internal
    networks:
      main:
        aliases:
          - node1.alt.internal
    privileged: true
    volumes:
      - ./mongodb-mms:/etc/mongodb-mms:ro
      - ./certs:/certs
    ports: 
      - "27171:27017"

  node2:
    build:
      context: .
      dockerfile: ./build/Dockerfile-aarch64-rhel8-node
    container_name: node2
    deploy:
      resources:
        limits:
          cpus: '2.000'
          memory: 2.5G
        reservations:
          cpus: '0.500'
          memory: 1G
    hostname: node2.om.internal
    networks:
      main:
        aliases:
          - node2.alt.internal
    privileged: true
    volumes:
      - ./mongodb-mms:/etc/mongodb-mms:ro
      - ./certs:/certs
    ports: 
      - "27172:27017"

  node3:
    build:
      context: .
      dockerfile: ./build/Dockerfile-aarch64-rhel8-node
    container_name: node3
    deploy:
      resources:
        limits:
          cpus: '2.000'
          memory: 2.5G
        reservations:
          cpus: '0.500'
          memory: 1G
    hostname: node3.om.internal
    networks:
      main:
        aliases:
          - node3.alt.internal
    privileged: true
    volumes:
      - ./mongodb-mms:/etc/mongodb-mms:ro
      - ./certs:/certs
    ports: 
      - "27173:27017"

  metadata:
    build:
      context: .
      dockerfile: ./build/Dockerfile-aarch64-rhel8-node
    container_name: metadata
    deploy:
      resources:
        limits:
          cpus: '0.500'
          memory: 0.50G
        reservations:
          cpus: '0.333'
          memory: 0.333G
    hostname: metadata.om.internal
    networks:
      main:
        aliases:
          - metadata
          - metadata.om.internal
          - metadata.alt.internal
    privileged: true
    volumes:
      - ./mongodb-mms:/etc/mongodb-mms:ro
      - ./certs:/certs

  oplog:
    build:
      context: .
      dockerfile: ./build/Dockerfile-aarch64-rhel8-node
    container_name: oplog
    deploy:
      resources:
        limits:
          cpus: '0.500'
          memory: 0.50G
        reservations:
          cpus: '0.333'
          memory: 0.33G
    hostname: oplog.om.internal
    networks:
      main:
        aliases:
          - oplog
          - oplog.om.internal
          - oplog.alt.internal
    privileged: true
    volumes:
      - ./mongodb-mms:/etc/mongodb-mms:ro
      - ./certs:/certs

  blockstore:
    build:
      context: .
      dockerfile: ./build/Dockerfile-aarch64-rhel8-node
    container_name: blockstore
    deploy:
      resources:
        limits:
          cpus: '0.500'
          memory: 0.50G
        reservations:
          cpus: '0.333'
          memory: 0.33G
    hostname: blockstore.om.internal
    networks:
      main:
        aliases:
          - blockstore
          - blockstore.om.internal
          - blockstore.alt.internal
    privileged: true
    volumes:
      - ./mongodb-mms:/etc/mongodb-mms:ro
      - ./certs:/certs

  proxy:
    image: diouxx/squid
    networks:
      main:
        aliases:
          - proxy
          - proxy.om.internal
          - proxy.alt.internal
    container_name: proxy
    deploy:
      resources:
        limits:
          cpus: '0.250'
          memory: 0.25G
        reservations:
          cpus: '0.125'
          memory: 0.125G
    hostname: proxy.om.internal
    ports:
      - "3128:3128"
    restart: always

  lb:
    build:
      context: .
      dockerfile: ./build/Dockerfile-nginx-lb
    networks:
      main: 
        aliases:
         - lb
         - lb.om.internal
         - lb.alt.internal
    container_name: lb
    deploy:
      resources:
        limits:
          cpus: '0.250'
          memory: 0.125G
        reservations:
          cpus: '0.125'
          memory: 0.062G
    ports: 
      - "80:80"
    restart: always

  smtp:
    image: dockage/mailcatcher:0.9.0
    networks:
      main: 
        aliases:
         - smtp
         - smtp.om.internal
         - smtp.alt.internal
    container_name: smtp
    deploy:
      resources:
        limits:
          cpus: '0.250'
          memory: 0.125G
        reservations:
          cpus: '0.125'
          memory: 0.062G
    ports: 
      - "1025:1025"
      - "1080:1080"
    restart: on-failure

  s3:
    image: dxflrs/garage:v1.0.0
    restart: unless-stopped
    volumes:
      - ./garage/garage.toml:/etc/garage.toml
      - ./garage/meta:/var/lib/garage/meta
      - ./garage/data:/var/lib/garage/data
    networks:
      main:
        aliases:
         - s3
         - s3.om.internal
         - oplog.s3.om.internal
         - blockstore.s3.om.internal
    container_name: s3
    deploy:
      resources:
        limits:
          cpus: '0.500'
          memory: 0.250G
        reservations:
          cpus: '0.250'
          memory: 0.250G
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
      - "3904:3904"

  kmip:
    build:
      context: .
      dockerfile: ./build/Dockerfile-pykmip
    stdin_open: true
    volumes:
      - ./data:/data
      - ./certs:/certs 
    container_name: kmip
    hostname: kmip.om.internal
    deploy:
      resources:
        limits:
          cpus: '0.250'
          memory: 0.125G
        reservations:
          cpus: '0.125'
          memory: 0.062G  
    networks:
      main:
        aliases:
         - kimp
         - kmip.om.internal
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: rustfs

    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console

    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"

    volumes:
      - ./rustfs-data:/data

    restart: unless-stopped

    command: /data

    healthcheck:
      test:
        - CMD-SHELL
        - "curl --fail http://127.0.0.1:9000/health/ready"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '0.750'
          memory: 0.5G
        reservations:
          cpus: '0.125'
          memory: 0.125G

    networks:
      main:
        aliases:
          - rustfs
          - rustfs.om.internal
          - rustfs.alt.internal

# rust init container to configure S3 buckets
  rustfs-init:
    image: rustfs/rc:v0.1.35

    depends_on:
      rustfs:
        condition: service_healthy

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        echo "Configuring RustFS S3..."

        rc alias set \
          infra-rustfs \
          http://rustfs:9000 \
          "rustfsadmin" \
          "rustfsadmin" \
          --region us-east-1 \
          --bucket-lookup path

        echo "Creating snapshot-store..."
        rc bucket create \
          --ignore-existing \
          infra-rustfs/snapshot-store

        echo "Creating oplog-store..."
        rc bucket create \
          --ignore-existing \
          infra-rustfs/oplog-store

        echo "Creating immutable-snapshot-store with Object Lock..."
        rc bucket create \
          --ignore-existing \
          --with-lock \
          infra-rustfs/immutable-snapshot-store

        echo ""
        echo "RustFS buckets:"
        rc bucket list infra-rustfs

        echo ""
        echo "RustFS bucket provisioning complete."

    restart: "no"
    networks:
      main:

         
networks:
  main:
